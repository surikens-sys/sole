<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>솔솔 소개팅 연습</title>
<meta name="description" content="연애 경험이 없어도 괜찮아요. 소개팅 대화를 선택지로 연습하고 코치 피드백을 받아보세요.">
<meta property="og:title" content="솔솔 소개팅 연습">
<meta property="og:description" content="소개팅 대화를 선택지로 연습하고 바로 코치 피드백을 받아보세요.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%23ff6f9c'/%3E%3Cpath d='M9 11h14a3 3 0 0 1 3 3v5a3 3 0 0 1-3 3h-7l-5 4v-4H9a3 3 0 0 1-3-3v-5a3 3 0 0 1 3-3z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <main class="room">
    <header class="top">
      <div class="avatar" id="avatar" aria-hidden="true">♥</div>
      <div class="who">
        <b id="partnerName">소개팅 상대</b>
        <span id="profile"></span>
      </div>
      <span class="progress" id="progress" aria-label="진행 상황"></span>
      <button class="restart" id="restart" type="button">상대 바꾸기</button>
      <div class="meter" aria-hidden="true"><span id="meter"></span></div>
    </header>

    <section class="setup" id="setup">
      <h1>오늘의 소개팅 상대</h1>
      <p>상대와 나의 정보를 골라주세요. 고르지 않으면 무작위로 정해져요. 내 MBTI에 맞춘 연습 질문이 섞여 나와요.</p>
      <fieldset>
        <legend>이름</legend>
        <div class="chips" id="nameChips"></div>
      </fieldset>
      <fieldset>
        <legend>직업</legend>
        <div class="chips" id="jobChips"></div>
      </fieldset>
      <fieldset>
        <legend>상대 MBTI</legend>
        <div class="chips mbti" id="mbtiChips"></div>
      </fieldset>
      <fieldset>
        <legend>내 MBTI</legend>
        <div class="chips mbti" id="myChips"></div>
      </fieldset>
      <button class="choice again" id="startBtn" type="button">소개팅 시작하기</button>
    </section>

    <section class="chat" id="chat" aria-live="polite"></section>

    <section class="choices" id="choices"></section>
  </main>

  <script src="questions.js?v=10"></script>
  <script src="app.js?v=10"></script>
</body>
</html>
